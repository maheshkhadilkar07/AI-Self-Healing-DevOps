<!doctype html><html><head><meta charset="utf-8"><title>Demo App (target)</title>
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}li{margin:6px 0}code{background:#eee;padding:2px 6px;border-radius:4px}</style></head>
<body><h2>Demo target application</h2>
<p>Version: <code id="v">...</code> &nbsp; This is the app the AI engine keeps healthy.</p>
<input id="t" placeholder="add an item"><button onclick="add()">Add</button><ul id="l"></ul>
<script>
async function load(){try{const r=await fetch('/api/items');document.getElementById('l').innerHTML=(await r.json()).map(i=>'<li>'+i.text+'</li>').join('');
const h=await (await fetch('/health')).json();document.getElementById('v').textContent=h.version}catch(e){document.getElementById('l').innerHTML='<li style="color:red">Service unavailable</li>'}}
async function add(){const t=document.getElementById('t');await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});t.value='';load()}
load();setInterval(load,2000);
</script></body></html>
