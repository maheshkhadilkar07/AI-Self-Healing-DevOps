# Target workload for Kubernetes / EKS (apply with: kubectl apply -f deploy/k8s/)
apiVersion: apps/v1
kind: Deployment
metadata: { name: demo-app, labels: { app: demo-app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata:
      labels: { app: demo-app }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "3000" }
    spec:
      containers:
        - name: demo-app
          image: demo-app:2.0          # build & push: docker build -t demo-app:2.0 demo-app/
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 3000 }, periodSeconds: 10 }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: demo-app }
spec: { selector: { app: demo-app }, ports: [{ port: 80, targetPort: 3000 }] }
