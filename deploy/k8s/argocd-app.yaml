# GitOps reconciliation (block diagram: ArgoCD). Replace repoURL with your Git repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: demo-app, namespace: argocd }
spec:
  project: default
  source: { repoURL: https://github.com/YOUR-ORG/YOUR-REPO.git, targetRevision: main, path: deploy/k8s }
  destination: { server: https://kubernetes.default.svc, namespace: default }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
