# Optional: run the target app + Prometheus in containers (matches the "Observability Layer" in your block diagram)
#   docker compose -f deploy/docker-compose.yml up --build
services:
  app:
    build: ../demo-app
    ports: ["3000:3000"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [app]
